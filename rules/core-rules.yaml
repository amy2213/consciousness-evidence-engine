version: 0.1
rules:
  - id: R-001
    name: correlation_is_not_causation
    severity: BLOCK
    statement: Correlational evidence cannot independently satisfy a causal claim.

  - id: R-002
    name: contribution_is_not_necessity
    severity: BLOCK
    statement: Evidence of causal contribution cannot independently establish necessity.

  - id: R-003
    name: necessity_is_not_sufficiency
    severity: BLOCK
    statement: Evidence supporting necessity cannot independently establish sufficiency.

  - id: R-004
    name: cognition_is_not_phenomenality
    severity: BLOCK
    statement: General cognitive or perceptual evidence cannot independently promote a phenomenal claim.

  - id: R-005
    name: component_is_not_whole_theory
    severity: BLOCK
    statement: Evidence for one theory component cannot be promoted to confirmation of the full theory.

  - id: R-006
    name: source_required_for_score_increase
    severity: BLOCK
    statement: A canonical claim score cannot increase unless the supporting evidence resolves to a registered source and exact claim link.

  - id: R-007
    name: cmc_four_requires_causal_triangulation
    severity: BLOCK
    statement: CMC 4 requires causal manipulation or perturbation plus convergent consciousness-sensitive measurement and preregistered or independently replicated support.

  - id: R-008
    name: negative_active_task_asymmetry
    severity: BLOCK
    statement: A negative demanding active-task result cannot support absence-directed CMC above 1 unless sensitivity, state quality, and major false-negative pathways are independently constrained.

  - id: R-009
    name: oec_cmc_firewall
    severity: BLOCK
    statement: An increase in Organizational Evidence Confidence does not imply or automatically cause an increase in Consciousness Measurement Confidence.

  - id: R-010
    name: organizational_complexity_not_consciousness
    severity: BLOCK
    statement: Differentiation, integration, recurrence, prediction, memory, learning, or complex dynamics cannot independently establish phenomenality.

  - id: R-011
    name: canonical_claim_role
    severity: ERROR
    statement: Population views must inherit Theory Role from the canonical claim record and may not redefine it.

  - id: R-012
    name: typed_null_semantics
    severity: ERROR
    statement: NA means not applicable; ND means applicable but not determined; database NULL must not substitute for either semantic state.

  - id: R-013
    name: no_ai_direct_commit
    severity: BLOCK
    statement: AI-produced extraction or scoring must remain candidate data until explicit review and approval.

  - id: R-014
    name: score_change_requires_audit
    severity: BLOCK
    statement: Any accepted change to PS, ED, CI, IR, RD, RR, ESI, STI, or RPS must generate an immutable audit event with rationale and provenance.
