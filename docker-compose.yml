services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: consciousness_engine
      POSTGRES_USER: cee
      POSTGRES_PASSWORD: cee_dev_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cee -d consciousness_engine"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - cee_pgdata:/var/lib/postgresql/data

volumes:
  cee_pgdata:
